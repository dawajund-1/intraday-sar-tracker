name: Daily Summary

on:
  schedule:
    # 20:05 UTC Mon-Fri = 23:05 AST (Riyadh), shortly after US market close.
    - cron: "5 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run daily summary
        shell: pwsh
        run: ./scripts/Get-DailySummary.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily summary $(date -u +%Y-%m-%d)"
          # Signal checks write to the same branch, so a push can lose the race.
          # Rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
