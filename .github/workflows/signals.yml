name: Daily Signal Check

on:
  schedule:
    # The live rule (config.json -> live.strategy) is RSI(2) on DAILY bars, so
    # it can only change once a day, when the daily bar closes. Polling every
    # 5 minutes would burn ~96 runs a day to re-read the same settled close.
    #
    # 20:20 UTC = 16:20 ET, shortly after the US close, Mon-Fri. The second
    # entry covers the EST half of the year, when the close is 21:00 UTC.
    # Remove-PartialBar discards a still-forming bar, so an early run is safe:
    # it simply reads yesterday's close and does nothing.
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run signal check
        shell: pwsh
        run: ./scripts/Get-Signals.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The Tadawul workflow writes to the same branch, so a push can lose the
          # race. Rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
