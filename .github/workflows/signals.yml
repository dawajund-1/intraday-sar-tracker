name: Hourly Signal Check

on:
  schedule:
    # Every 15 min (offset :07/:22/:37/:52 to avoid GitHub's documented top-of-hour
    # and on-the-mark scheduling congestion), 13:00-20:59 UTC, Mon-Fri = 16:00-23:59
    # AST (Riyadh), covering US market hours across both EST and EDT with padding.
    - cron: "7,22,37,52 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run signal check
        shell: pwsh
        run: ./scripts/Get-Signals.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
