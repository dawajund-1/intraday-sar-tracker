name: Hourly Signal Check

on:
  schedule:
    # Every 5 min (GitHub Actions' shortest supported schedule interval),
    # 13:00-20:59 UTC, Mon-Fri = 16:00-23:59 AST (Riyadh), covering US market hours
    # across both EST and EDT with padding.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run signal check
        shell: pwsh
        run: ./scripts/Get-Signals.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The Tadawul workflow writes to the same branch, so a push can lose the
          # race. Rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
