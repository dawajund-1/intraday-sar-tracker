name: Tadawul Daily Summary

on:
  schedule:
    # 12:10 UTC = 15:10 AST (Riyadh), shortly after Tadawul close, Sun-Thu.
    - cron: "10 12 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Tadawul daily summary
        shell: pwsh
        run: ./scripts-sa/Get-DailySummary.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-sa/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Tadawul daily summary $(date -u +%Y-%m-%d)"
          # Signal checks write to the same branch, so a push can lose the race.
          # Rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
