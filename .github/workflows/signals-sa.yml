name: Tadawul Signal Check

on:
  schedule:
    # Every 5 min, 06:00-12:59 UTC = 09:00-15:59 AST (Riyadh), Sun-Thu (Tadawul's
    # trading week, not Mon-Fri). Covers pre-open through close with padding.
    # Cron day-of-week: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu.
    - cron: "*/5 6-12 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Tadawul signal check
        shell: pwsh
        run: ./scripts-sa/Get-Signals.ps1

      - name: Commit updated data
        run: |
          git config user.name "intraday-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-sa/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Tadawul signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The US workflow writes to the same branch, so a push can lose the
          # race. Rebase onto whatever landed and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
