name: Halal prices (for Jund Halal Trader)

# Fetches daily prices for halal/tickers.json into halal/prices.json.
# Market data only: no trades, no alerts, never touches data/ or the tracker's state.
# Runs near the US close in both summer and winter time (GitHub cron is UTC).

on:
  schedule:
    - cron: "25 19 * * 1-5"
    - cron: "25 20 * * 1-5"
    - cron: "20 21 * * 1-5"
    - cron: "10 22 * * 1-5"
  push:
    branches: [main]
    paths: ["halal/tickers.json", "halal/fetch_prices.py", ".github/workflows/halal-prices.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halal-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 halal/fetch_prices.py
      - name: Commit
        run: |
          git config user.name "halal-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add halal/prices.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -q -m "Update halal prices $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
