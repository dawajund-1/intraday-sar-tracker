name: Halal prices (for Jund Halal Trader)

# Fetches daily prices for halal/tickers.json into halal/prices.json.
# Market data only: no trades, no alerts, never touches data/ or the tracker's state.
# Runs near the US close in both summer and winter time (GitHub cron is UTC).

on:
  schedule:
    # GitHub starts scheduled jobs late, so start early and sleep to exact New York times
    - cron: "0 15 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "20 22 * * 1-5"
  push:
    branches: [main]
    paths: ["halal/tickers.json", "halal/fetch_prices.py", "halal/signals.js", "halal/report.js", ".github/workflows/halal-prices.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halal-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Fetch now, then at 15:30 and 16:15 New York
        run: |
          set -u
          git config user.name "halal-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          today=$(TZ=America/New_York date +%F)
          at() { TZ=America/New_York date -d "$today $1" +%s; }
          publish() {
            python3 halal/fetch_prices.py || return 0
            git add halal/prices.json
            git diff --cached --quiet && { echo "No change"; return 0; }
            git commit -q -m "Update halal prices $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && return 0
              sleep $((i * 5))
            done
            echo "::warning::push failed"
          }
          publish
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          [ "$(TZ=America/New_York date +%u)" -ge 6 ] && exit 0
          for t in 15:30 16:15; do
            d=$(( $(at $t) - $(date +%s) ))
            if [ $d -gt 0 ]; then echo "waiting $d s for $t New York"; sleep $d; publish; fi
          done
